worker_processes auto;

events {
    worker_connections 1024;
}

# ============================================================================
#  nginx full Docker.
#  Publico: 80. Interno: fastapi:8000, moodle:8080, frontend_build.
# ============================================================================

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    client_max_body_size 100M;

    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"request_method":"$request_method",'
            '"request_uri":"$request_uri",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time",'
            '"user_agent":"$http_user_agent",'
            '"upstream":"$upstream_addr"'
        '}';

    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    limit_req_zone $http_authorization zone=ai_zone:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=anon_zone:10m rate=60r/m;

    upstream fastapi_ia {
        server fastapi:8000;
    }

    upstream moodle_lms {
        server moodle:8080;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location /api/ai/chat {
            limit_req zone=ai_zone burst=5 nodelay;
            proxy_pass http://fastapi_ia/chat;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-User-Id $http_x_user_id;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /api/ai/ {
            limit_req zone=anon_zone burst=20 nodelay;
            proxy_pass http://fastapi_ia/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-User-Id $http_x_user_id;
            proxy_read_timeout 120s;
        }

        location /api/lms/ {
            limit_req zone=anon_zone burst=20 nodelay;
            proxy_pass http://moodle_lms/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Prefix /api/lms;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 120s;
        }

        location /moodle_api/ {
            limit_req zone=anon_zone burst=20 nodelay;
            proxy_pass http://moodle_lms/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Prefix /api/lms;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 120s;
        }

        # Moodle puede verse por /moodle/ para administracion inicial, pero Moodle
        # bajo subruta suele requerir wwwroot coherente. Para produccion estable,
        # preferir subdominio futuro: moodle.DOMINIO -> moodle:8080.
        location /moodle/ {
            limit_req zone=anon_zone burst=20 nodelay;
            proxy_pass http://moodle_lms/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Prefix /api/lms;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 120s;
        }

        location /rag_api/ {
            limit_req zone=anon_zone burst=20 nodelay;
            proxy_pass http://fastapi_ia/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-User-Id $http_x_user_id;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 120s;
        }

        location /api/ {
            limit_req zone=anon_zone burst=20 nodelay;
            proxy_pass http://fastapi_ia/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-User-Id $http_x_user_id;
            proxy_read_timeout 120s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}