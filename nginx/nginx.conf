worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    client_max_body_size 25M;

    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"request_method":"$request_method",'
            '"request_uri":"$request_uri",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time",'
            '"user_agent":"$http_user_agent",'
            '"upstream":"$upstream_addr"'
        '}';

    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    limit_req_zone $http_authorization zone=ai_zone:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=anon_zone:10m rate=60r/m;

    upstream fastapi_ia {
        server fastapi:8000;
    }

    upstream moodle_lms {
        # Moodle vive fuera del compose:
        #  - Dev local: XAMPP en C:\Moodle\server (Apache puerto 80 del host Windows).
        #  - Servidor del tutor: reemplazar por hostname/IP del Moodle instalado.
        # `host.docker.internal` se resuelve via la entrada extra_hosts del gateway.
        server host.docker.internal:80;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location /api/ai/chat {
            limit_req zone=ai_zone burst=5 nodelay;
            proxy_pass http://fastapi_ia/chat;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-User-Id $http_x_user_id;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # "Preparar tutor con IA" (POST .../ai-prepare) corre modelos pesados: quality=max
        # usa el revisor deepseek-r1:32b (razonador) sobre draft+reintento de cobertura y
        # puede tardar varios minutos. Sin esto cae en /api/ai/ (120s) -> 504 del gateway.
        location /api/ai/authoring/ {
            limit_req zone=anon_zone burst=20 nodelay;
            proxy_pass http://fastapi_ia/authoring/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-User-Id $http_x_user_id;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        location /api/ai/ {
            limit_req zone=anon_zone burst=20 nodelay;
            proxy_pass http://fastapi_ia/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-User-Id $http_x_user_id;
            proxy_read_timeout 120s;
        }

        location /api/lms/ {
            limit_req zone=anon_zone burst=20 nodelay;
            proxy_pass http://moodle_lms/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 120s;
        }

        # Aliases retrocompatibles: el plugin local_tesisai y la suite proyecto_curso/api_persistente
        # generan URLs con /moodle_api/ hardcoded en respuestas (ej. courseimage). Mantenerlos
        # como alias evita tocar el codigo PHP. En desarrollo, vite hace el mismo mapeo.
        location /moodle_api/ {
            limit_req zone=anon_zone burst=20 nodelay;
            proxy_pass http://moodle_lms/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 120s;
        }

        location /rag_api/ {
            limit_req zone=anon_zone burst=20 nodelay;
            proxy_pass http://fastapi_ia/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-User-Id $http_x_user_id;
            proxy_read_timeout 120s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # HTTPS server (descomentar y completar cuando el tutor confirme dominio)
    # server {
    #     listen 443 ssl http2;
    #     server_name ${PUBLIC_HOST};
    #
    #     ssl_certificate     /etc/letsencrypt/live/${PUBLIC_HOST}/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/${PUBLIC_HOST}/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    #     # ...mismas location blocks que el server :80...
    # }
}
