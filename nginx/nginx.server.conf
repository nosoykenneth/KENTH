worker_processes auto;

events {
    worker_connections 1024;
}

# ============================================================================
#  nginx del SERVIDOR (despliegue hibrido).
#  Unica diferencia con nginx.conf (dev): el upstream moodle_lms apunta a
#  host.docker.internal:8081 (Apache de Moodle NATIVO en el host, detras del
#  gateway). El gateway ocupa el :80 publico, por eso Moodle se mueve al :8081.
# ============================================================================

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    client_max_body_size 25M;

    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"request_method":"$request_method",'
            '"request_uri":"$request_uri",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time",'
            '"user_agent":"$http_user_agent",'
            '"upstream":"$upstream_addr"'
        '}';

    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    limit_req_zone $http_authorization zone=ai_zone:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=anon_zone:10m rate=60r/m;

    upstream fastapi_ia {
        server fastapi:8000;
    }

    upstream moodle_lms {
        # Moodle (Apache) NATIVO en el host, en el puerto 8081 (el :80 lo ocupa
        # este gateway). host.docker.internal se resuelve via extra_hosts.
        server host.docker.internal:8081;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location /api/ai/chat {
            limit_req zone=ai_zone burst=5 nodelay;
            proxy_pass http://fastapi_ia/chat;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-User-Id $http_x_user_id;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /api/ai/ {
            limit_req zone=anon_zone burst=20 nodelay;
            proxy_pass http://fastapi_ia/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-User-Id $http_x_user_id;
            proxy_read_timeout 120s;
        }

        # Moodle/H5P loads many parallel CSS/JS/media assets. Do not rate-limit
        # this proxy path; keep request limits on AI/API endpoints instead.
        location /api/lms/ {
            proxy_pass http://moodle_lms/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 120s;
        }

        # Aliases retrocompatibles: el plugin local_tesisai y proyecto_curso/api_persistente
        # generan URLs con /moodle_api/ hardcoded en respuestas. Mantenerlos como alias
        # evita tocar el PHP. Same traffic profile as /api/lms, including bursty
        # H5P/static asset loads.
        location /moodle_api/ {
            proxy_pass http://moodle_lms/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 120s;
        }

        location /rag_api/ {
            limit_req zone=anon_zone burst=20 nodelay;
            proxy_pass http://fastapi_ia/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-User-Id $http_x_user_id;
            proxy_read_timeout 120s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # HTTPS (descomentar y completar cuando haya dominio; ver runbook seccion TLS)
    # server {
    #     listen 443 ssl http2;
    #     server_name TU_DOMINIO;
    #     ssl_certificate     /etc/letsencrypt/live/TU_DOMINIO/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/TU_DOMINIO/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     # ...mismas location blocks que el server :80...
    # }
}
