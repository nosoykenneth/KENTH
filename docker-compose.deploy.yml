name: tic-kenth

# ============================================================================
#  Despliegue REAL en el servidor del profe (192.168.1.199), full Docker.
#  Diferencias vs docker-compose.full.yml:
#    - Moodle corre el CODIGO REAL de la laptop (5.0.4+) via deploy/moodle.Dockerfile,
#      no bitnami -> paridad de version con el dump y trae local/tesisai + api_persistente.
#    - El dump de Moodle se IMPORTA solo en el primer arranque (initdb.d de mariadb).
#    - El gateway publica en 8090 (el :80 del host lo ocupa microk8s/jupyter).
#    - Ollama es NATIVO en el host (GPU) -> host.docker.internal:11434.
#  Uso:
#    docker compose -f docker-compose.deploy.yml --env-file .env up -d --build
# ============================================================================

networks:
  internal:
    driver: bridge

volumes:
  loki_data:
  grafana_data:
  frontend_build:

services:
  mariadb:
    image: mariadb:11.4
    container_name: tic-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MOODLE_DB_NAME}
      MARIADB_USER: ${MOODLE_DB_USER}
      MARIADB_PASSWORD: ${MOODLE_DB_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-allowed-packet=128M
    volumes:
      - ./runtime/mariadb:/var/lib/mysql
      # Import automatico SOLO si el datadir esta vacio (primer arranque).
      - ./_migration/moodle_dump.sql:/docker-entrypoint-initdb.d/01_moodle.sql:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 24
    restart: unless-stopped

  moodle:
    build:
      context: .
      dockerfile: deploy/moodle.Dockerfile
    image: tic-kenth/moodle:5.0-real
    container_name: tic-moodle
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      MOODLE_DB_HOST: ${MOODLE_DB_HOST}
      MOODLE_DB_PORT: ${MOODLE_DB_PORT}
      MOODLE_DB_NAME: ${MOODLE_DB_NAME}
      MOODLE_DB_USER: ${MOODLE_DB_USER}
      MOODLE_DB_PASSWORD: ${MOODLE_DB_PASSWORD}
      MOODLE_DB_PREFIX: ${MOODLE_DB_PREFIX}
      # Moodle tiene su PROPIO origen publico (:8091) para que sus redirects
      # internos (login, tesis_view->/mod/.., admin) no caigan en el SPA (:8090).
      MOODLE_WWWROOT: ${MOODLE_WWWROOT}
      PUBLIC_SCHEME: ${PUBLIC_SCHEME}
    volumes:
      - ./runtime/moodle:/var/www/html
      - ./runtime/moodledata:/var/moodledata
      - ./deploy/moodle-config.php:/var/www/html/config.php:ro
    ports:
      # Acceso directo del navegador a Moodle por su wwwroot propio.
      - "8091:8080"
    networks: [internal]
    restart: unless-stopped

  # Moodle REQUIERE cron cada minuto (tareas programadas, correos, H5P, busqueda,
  # limpieza). Sidecar que ejecuta admin/cli/cron.php en bucle. Corre como www-data
  # (uid 33) para no dejar archivos root en moodledata.
  moodle-cron:
    image: tic-kenth/moodle:5.0-real
    container_name: tic-moodle-cron
    depends_on:
      moodle:
        condition: service_started
    user: "33:33"
    environment:
      MOODLE_DB_HOST: ${MOODLE_DB_HOST}
      MOODLE_DB_PORT: ${MOODLE_DB_PORT}
      MOODLE_DB_NAME: ${MOODLE_DB_NAME}
      MOODLE_DB_USER: ${MOODLE_DB_USER}
      MOODLE_DB_PASSWORD: ${MOODLE_DB_PASSWORD}
      MOODLE_DB_PREFIX: ${MOODLE_DB_PREFIX}
      MOODLE_WWWROOT: ${MOODLE_WWWROOT}
      PUBLIC_SCHEME: ${PUBLIC_SCHEME}
    volumes:
      - ./runtime/moodle:/var/www/html
      - ./runtime/moodledata:/var/moodledata
      - ./deploy/moodle-config.php:/var/www/html/config.php:ro
    entrypoint: ["sh", "-c", "while true; do php /var/www/html/admin/cli/cron.php >/dev/null 2>&1 || true; sleep 60; done"]
    networks: [internal]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend-tesis
      dockerfile: Dockerfile
    image: tic-kenth/frontend:latest
    container_name: tic-frontend
    volumes:
      - frontend_build:/shared
    networks: [internal]
    restart: unless-stopped

  fastapi:
    build:
      context: ./tesis-rag
      dockerfile: Dockerfile
    image: tic-kenth/fastapi:latest
    container_name: tic-fastapi
    depends_on:
      mariadb:
        condition: service_healthy
      moodle:
        condition: service_started
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      # langchain_ollama/ollama crean el cliente sin base_url -> leen OLLAMA_HOST.
      # Sin esto el contenedor apunta a 127.0.0.1 (a si mismo) y no halla Ollama.
      OLLAMA_HOST: ${OLLAMA_BASE_URL}
      KENTH_TEXT_MODEL: ${KENTH_TEXT_MODEL}
      KENTH_VISION_MODEL: ${KENTH_VISION_MODEL}
      KENTH_EMBED_MODEL: ${KENTH_EMBED_MODEL}
      AI_PREP_MODEL: ${AI_PREP_MODEL:-qwen3:14b}
      AI_PREP_LONG_CONTEXT_MODEL: ${AI_PREP_LONG_CONTEXT_MODEL:-qwen3:14b}
      CHROMA_DIR: ${CHROMA_DIR}
      MOODLE_BASE_URL: ${MOODLE_BASE_URL}
      MOODLE_DBTYPE: mariadb
      MOODLE_DBHOST: ${MOODLE_DB_HOST}
      MOODLE_DBPORT: ${MOODLE_DB_PORT}
      MOODLE_DBNAME: ${MOODLE_DB_NAME}
      MOODLE_DBUSER: ${MOODLE_DB_USER}
      MOODLE_DBPASS: ${MOODLE_DB_PASSWORD}
      MOODLE_DB_PREFIX: ${MOODLE_DB_PREFIX}
      MOODLE_WS_BASE: ${MOODLE_WS_BASE}
      MOODLE_WS_TOKEN: ${MOODLE_WS_TOKEN}
      KENTH_COURSE_ID_SECRET: ${KENTH_COURSE_ID_SECRET}
      TESISAI_ALLOW_SQLITE_FALLBACK: ${TESISAI_ALLOW_SQLITE_FALLBACK}
      # Ruta del moodledata DENTRO de este contenedor (igual que el volumen ro de abajo).
      # Necesario para que la transcripcion automatica localice el .mp4 del H5P por
      # contenthash; sin esto find_hvp_video_path no halla el archivo -> 422.
      MOODLE_DATAROOT: /var/moodledata
      # Cache del modelo faster-whisper (huggingface) en un volumen persistente,
      # para no re-descargar ~480MB en cada recreacion del contenedor.
      HF_HOME: /app/hf-cache
    volumes:
      - ./runtime/chroma:/app/bd_vectorial
      - ./runtime/fastapi-chat:/app/bd_chat
      # moodledata de Moodle (mismo host dir que el contenedor moodle), solo lectura:
      # FastAPI lee los videos subidos para transcribirlos con faster-whisper.
      - ./runtime/moodledata:/var/moodledata:ro
      # Cache persistente del modelo Whisper (se descarga una sola vez).
      - ./runtime/whisper-cache:/app/hf-cache
    networks: [internal]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  gateway:
    image: nginx:alpine
    container_name: tic-gateway
    depends_on:
      - fastapi
      - frontend
      - moodle
    ports:
      - "8090:80"
    volumes:
      - ./nginx/nginx.full.conf:/etc/nginx/nginx.conf:ro
      - frontend_build:/usr/share/nginx/html:ro
    networks: [internal]
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.0
    container_name: tic-loki
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./logging/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    networks: [internal]
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.0
    container_name: tic-promtail
    depends_on: [loki]
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./logging/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [internal]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    container_name: tic-grafana
    depends_on: [loki]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./logging/grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [internal]
    restart: unless-stopped
