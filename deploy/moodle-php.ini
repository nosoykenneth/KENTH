; Ajustes PHP que Moodle requiere/recomienda.
; output_buffering como en XAMPP (la laptop). Sin esto, archivos PHP con BOM
; (p.ej. proyecto_curso/api_persistente/tesis_view.php) envian bytes antes de
; arrancar la sesion -> "sessionstarterror" y rompe H5P/quiz. Bufferear lo evita.
output_buffering = 4096
memory_limit = 512M
post_max_size = 100M
upload_max_filesize = 100M
max_input_vars = 5000
max_execution_time = 300
; Moodle exige cookies y zona horaria definida.
date.timezone = America/Guayaquil
; opcache recomendado para produccion.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 60
