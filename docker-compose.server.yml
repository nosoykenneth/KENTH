name: tic-kenth-server

# ============================================================================
#  Despliegue HIBRIDO en el servidor del tutor (Ubuntu, RTX 5070 Ti / 64GB).
#
#  NATIVOS en el host (NO en este compose):
#    - Ollama            -> systemd, usa la GPU directo. Escucha en 0.0.0.0:11434.
#    - Moodle (Apache)   -> nativo en 127.0.0.1:8081 (detras del gateway).
#    - MariaDB           -> nativo en 127.0.0.1:3306.
#
#  EN ESTE COMPOSE (CPU-only, reproducible -> "docker compose up"):
#    - frontend (build estatico) + gateway nginx (:80) + fastapi (RAG)
#    - Loki / Promtail / Grafana (observabilidad, metricas OE4).
#
#  fastapi y gateway alcanzan Ollama/Moodle/MariaDB del host via host.docker.internal.
#  Uso:  docker compose -f docker-compose.server.yml up -d --build
# ============================================================================

networks:
  internal:
    driver: bridge

volumes:
  loki_data:
  grafana_data:
  frontend_build:

services:

  # --- Presentacion: build estatico del SPA -> volumen compartido que sirve el gateway ---
  frontend:
    build:
      context: ./frontend-tesis
      dockerfile: Dockerfile
    image: tic-kenth/frontend:latest
    container_name: tic-frontend
    volumes:
      - frontend_build:/shared
    networks: [internal]

  # --- API Gateway (entrada publica :80) ---
  gateway:
    image: nginx:alpine
    container_name: tic-gateway
    depends_on: [fastapi, frontend]
    ports:
      - "80:80"
      # - "443:443"   # descomentar al activar TLS (ver runbook)
    volumes:
      - ./nginx/nginx.server.conf:/etc/nginx/nginx.conf:ro
      - frontend_build:/usr/share/nginx/html:ro
      # - ./nginx/certs:/etc/letsencrypt:ro
    networks: [internal]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # --- Servicio Python (IA / RAG) ---
  fastapi:
    build:
      context: ./tesis-rag
      dockerfile: Dockerfile
    image: tic-kenth/fastapi:latest
    container_name: tic-fastapi
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      KENTH_TEXT_MODEL: ${KENTH_TEXT_MODEL}
      KENTH_VISION_MODEL: ${KENTH_VISION_MODEL}
      KENTH_EMBED_MODEL: ${KENTH_EMBED_MODEL}
      CHROMA_DIR: ${CHROMA_DIR}
      MOODLE_DBTYPE: ${MOODLE_DBTYPE}
      MOODLE_DBHOST: ${MOODLE_DBHOST}
      MOODLE_DBPORT: ${MOODLE_DBPORT}
      MOODLE_DBNAME: ${MOODLE_DBNAME}
      MOODLE_DBUSER: ${MOODLE_DBUSER}
      MOODLE_DBPASS: ${MOODLE_DBPASS}
      MOODLE_DB_PREFIX: ${MOODLE_DB_PREFIX}
      MOODLE_WS_BASE: ${MOODLE_WS_BASE}
      MOODLE_WS_TOKEN: ${MOODLE_WS_TOKEN}
      KENTH_COURSE_ID_SECRET: ${KENTH_COURSE_ID_SECRET}
      TESISAI_ALLOW_SQLITE_FALLBACK: ${TESISAI_ALLOW_SQLITE_FALLBACK}
    volumes:
      # Bind-mounts para SEMBRAR datos copiados desde la laptop (no volumenes anonimos):
      #   bd_vectorial -> indice Chroma ya construido (embed = nomic-embed-text; ver .env).
      #   bd_chat      -> fallback SQLite dev (no se usa con Moodle activo; se deja por simetria).
      - ./tesis-rag/bd_vectorial:/app/bd_vectorial
      - ./tesis-rag/bd_chat:/app/bd_chat
    networks: [internal]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # --- Logs: Loki + Promtail + Grafana ---
  loki:
    image: grafana/loki:2.9.0
    container_name: tic-loki
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./logging/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    networks: [internal]
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.0
    container_name: tic-promtail
    depends_on: [loki]
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./logging/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [internal]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    container_name: tic-grafana
    depends_on: [loki]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASS}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      # SOLO loopback del host: Grafana NO debe ser alcanzable desde la IP publica.
      # Docker publica puertos saltandose ufw, por eso el bind a 127.0.0.1 es la
      # defensa real (no basta el firewall). Acceso remoto = tunel SSH:
      #   ssh -L 3000:127.0.0.1:3000 usuario@SERVIDOR  -> http://localhost:3000
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./logging/grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [internal]
    restart: unless-stopped
