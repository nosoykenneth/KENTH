server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Captura stdout/stderr de TODOS los contenedores Docker via socket.
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
    pipeline_stages:
      # Si el log es JSON (FastAPI o gateway), extraer campos para que sean queryables.
      - match:
          selector: '{service=~"fastapi|gateway"}'
          stages:
            - json:
                expressions:
                  level: level
                  user_id: user_id
                  intent: intent
                  evidence_level: evidence_level
                  status: status
                  request_uri: request_uri
                  request_time: request_time
            - labels:
                level:
                intent:
                evidence_level:
                status:
